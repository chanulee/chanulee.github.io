<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanwoo Lee</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <p class="site-links">
        <a href="/index.html">Chanwoo Lee</a>
        <a href="/projects.html">Projects</a>
        <a href="/about.html">About</a>
    </p>

    <div class="intro">
        <p>Vision-Driven Curiosity.</p>
        <p>Building Human-Centred Future.</p>
    </div>

    <!--
      Landing stream: edit order here in HTML.
      - Project: <div class="project" data-project="Exact name from projects.json"></div>
      - Quote:   <div class="quote" style="background:#C8D9C9">Your text</div>
    -->
    <main class="stream">
        <div class="project" data-project="Neuro-AI wearable"></div>
        <div class="project" data-project="Synapse"></div>

        <div class="quote" style="background:#C8D9C9">
            Example quote or comment goes here.
        </div>

        <div class="project" data-project="TwelveLabs"></div>
        <div class="project" data-project="Digital Double"></div>
        <div class="project" data-project="Sensory Misalignment"></div>
    </main>

    <div class="site-end">
        <p><a href="mailto:chanwoo.lee@imperial.ac.uk">chanwoo.lee@imperial.ac.uk</a></p>
        <p class="links">
            <a href="https://www.linkedin.com/in/chanulee/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/chanulee" target="_blank" rel="noopener">GitHub</a>
            <a href="https://instagram.com/chnwlee" target="_blank" rel="noopener">Instagram</a>
            <a href="https://twitter.com/chnwlee" target="_blank" rel="noopener">Twitter</a>
        </p>
        <p>© 2026 Chanwoo Lee</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const projects = await fetch('projects.json').then(r => r.json());
                const byName = Object.fromEntries(projects.map(p => [p.project, p]));

                document.querySelectorAll('.stream .project[data-project]').forEach(slot => {
                    const project = byName[slot.dataset.project];
                    if (!project || !project.thumbnail) {
                        slot.remove();
                        return;
                    }

                    let el = slot;
                    if (project.projectLink) {
                        const link = document.createElement('a');
                        link.className = 'project';
                        link.href = project.projectLink;
                        if (project.projectLink.startsWith('http')) {
                            link.target = '_blank';
                            link.rel = 'noopener';
                        }
                        slot.replaceWith(link);
                        el = link;
                    }

                    const img = document.createElement('img');
                    img.src = project.thumbnail;
                    img.alt = project.project || '';
                    el.appendChild(img);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        });
    </script>
</body>
</html>
