<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Chanwoo Lee</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <p class="site-links">
        <a href="/index.html">Chanwoo Lee</a>
        <a href="/projects.html">Projects</a>
        <a href="/about.html">About</a>
    </p>

    <main class="content">
        <div class="project-index" id="projectList"></div>
    </main>

    <div class="site-end">
        <p><a href="mailto:chanwoo.lee@imperial.ac.uk">chanwoo.lee@imperial.ac.uk</a></p>
        <p class="links">
            <a href="https://www.linkedin.com/in/chanulee/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/chanulee" target="_blank" rel="noopener">GitHub</a>
            <a href="https://instagram.com/chnwlee" target="_blank" rel="noopener">Instagram</a>
            <a href="https://twitter.com/chnwlee" target="_blank" rel="noopener">Twitter</a>
        </p>
        <p>© 2026 Chanwoo Lee</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const list = document.getElementById('projectList');

            try {
                const projects = await fetch('projects.json').then(r => r.json());
                const currentYear = new Date().getFullYear();

                const sorted = [...projects].sort((a, b) => {
                    let yearA = String(a.year).toLowerCase();
                    let yearB = String(b.year).toLowerCase();
                    if (yearA === 'ongoing') yearA = currentYear + 1;
                    if (yearB === 'ongoing') yearB = currentYear + 1;
                    return (parseInt(yearB, 10) || 0) - (parseInt(yearA, 10) || 0);
                });

                sorted.forEach(project => {
                    const hasLink = !!project.projectLink;
                    const el = document.createElement(hasLink ? 'a' : 'div');
                    el.className = 'row';

                    if (hasLink) {
                        el.href = project.projectLink;
                        if (project.projectLink.startsWith('http')) {
                            el.target = '_blank';
                            el.rel = 'noopener';
                        }
                    }

                    const meta = [project.affiliation, project.year].filter(Boolean).join(' · ');
                    el.innerHTML = `
                        <span class="name">${project.project || ''}</span>
                        ${meta ? `<br><span>${meta}</span>` : ''}
                    `;
                    list.appendChild(el);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                list.innerHTML = '<p>Failed to load projects.</p>';
            }
        });
    </script>
</body>
</html>
