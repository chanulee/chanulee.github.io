<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #EBEBEB;
            color: #161615;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* Use dvh for full dynamic viewport height */
            padding: 8px;
            box-sizing: border-box;
            gap: 8px;
        }

        h2 {
            margin: 0;
            margin-top: 4px;
            margin-bottom: 4px;
            font-size: 2em;
            font-weight: 500;
            text-align: left;
            line-height: 1.1;
            width: 100%;
            flex-shrink: 0;
        }

        .btn {
            background-color: #FFFFFF;
            color: #161615;
            border-radius: 16px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1em;
            font-weight: 500;
            transition: transform 0.1s ease;
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        .big-btn {
            flex-grow: 1;
        }

        .small-btn-container {
            display: flex;
            gap: 8px;
            height: 60px;
            flex-shrink: 0;
        }

        .small-btn {
            background-color: #dbdbdb;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hi 👋 Thanks for your interest! <br> You can find me here:</h2>
        <a href="https://www.linkedin.com/in/chanulee/" class="btn big-btn" target="_blank">💼 LINKEDIN</a> 
        <a href="https://www.instagram.com/chnwlee/" class="btn big-btn" target="_blank">📸 INSTAGRAM</a>
        <!-- <div class="small-btn-container">
            <a href="https://modemworks.com/research/digital-doubles/" class="btn small-btn" target="_blank">ref: DIGITAL DOUBLE</a>

        </div> -->
    </div>
</body>
</html>
